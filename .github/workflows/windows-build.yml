name: Windows build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: lukka/run-vcpkg@v11
      - id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.9.3
          arch: win64_msvc2022_64
      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build -G "Visual Studio 18 2026" -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DPLAYERDEMO_QT_ROOT="${{ steps.qt.outputs.dir }}"
      - name: Build Debug
        run: cmake --build build --config Debug
      - name: Test Debug
        run: ctest --test-dir build -C Debug --output-on-failure
      - name: Build Release
        run: cmake --build build --config Release
      - name: Test Release
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Verify binary C SDK
        shell: pwsh
        run: |
          cmake --install build --config Release --component PlayerSDK --prefix build/PlayerSDK
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake -S build/PlayerSDK/examples -B build/sdk-installed-smoke -G "Visual Studio 18 2026" -A x64 "-DCMAKE_PREFIX_PATH=$PWD/build/PlayerSDK"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/sdk-installed-smoke --config Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:SDL_AUDIODRIVER = "dummy"
          & ./build/sdk-installed-smoke/Release/player_sdk_smoke.exe
          exit $LASTEXITCODE
      - name: Upload binary C SDK
        uses: actions/upload-artifact@v4
        with:
          name: PlayerSDK-windows-x64
          path: build/PlayerSDK/
      - name: Package portable release
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/package-portable.ps1 -BuildDir build -Configuration Release -Version 1.0.0
      - name: Upload portable release
        uses: actions/upload-artifact@v4
        with:
          name: MyPlayer-portable-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
